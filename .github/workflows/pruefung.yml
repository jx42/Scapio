# Die Uebergabepruefung, so wie sie lokal laeuft — nur auf einem Rechner, den niemand
# vorher eingerichtet hat. Sie ersetzt `npm run check` nicht, sie wiederholt es.
#
# Drei Betriebssysteme, weil dieses Projekt Pfade, Dateirechte und Zeitzonen anfasst und
# genau dort die Unterschiede sitzen. Windows ist keine Zugabe, sondern eine der beiden
# Plattformen, die AGENTS.md nennt — und die einzige, auf der sich ein Pfadtrenner, eine
# fehlende `LOCALAPPDATA` oder ein Unterprozess ohne Shell still anders verhaelt, als der
# Autor es auf seinem Rechner sieht. Genau dafuer laeuft sie hier mit.
#
# Die Zeitzonen laufen nur unter Linux und ohne UTC: Die Runner stehen ohnehin auf UTC,
# und Node bringt sein eigenes ICU mit, wertet `TZ` also ueberall gleich aus. [ADR-050]
#
# `--ignore-scripts` auch hier, aus demselben Grund wie ueberall sonst: kein Paket dieses
# Projekts braucht ein Install-Skript, und eines, das eines mitbraechte, soll es nicht
# unbemerkt ausfuehren duerfen. [docs/ENTWICKLUNG.md]

name: Pruefung

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # `release.yml` ruft dieselbe Pruefung auf, statt sie zu kopieren. [ADR-047]
  workflow_call:

permissions:
  contents: read

# Ein neuer Push auf einen Pull Request bricht dessen alten Lauf ab. Alles andere bekommt
# eine eigene Gruppe — sonst koennte ein Push auf `main` die Pruefung eines Releases
# verdraengen.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pruefung-{0}', github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.system }})
    runs-on: ${{ matrix.image }}
    strategy:
      # Ein macOS-Fehler soll nicht verdecken, ob Linux gruen war — und umgekehrt.
      fail-fast: false
      # Feste Images statt `-latest`: ein Wechsel des Runners soll ein eigener Commit sein,
      # kein stiller Wechsel unter einem gruenen Haken. Der Jobname haengt am System, nicht am
      # Image — das Ruleset fuer `main` verlangt ihn als Pflicht-Check. [ADR-055]
      matrix:
        include:
          - { system: macos, image: macos-15 }
          - { system: linux, image: ubuntu-24.04 }
          - { system: windows, image: windows-2025 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      # Vor `check`, nicht danach: INV-11 durchsucht `dist/` nach fremden Adressen im
      # gebauten Ergebnis — ohne Bau vorher waere dieser Teil des Tests ein stiller
      # Blindgaenger, der immer gruen ist, weil es nichts zu durchsuchen gibt.
      # Nur `vite build`: den Typecheck macht `check` gleich danach.
      - run: npx --no-install vite build

      # typecheck + lint + tests + Invarianten.
      - run: npm run check

  # Westlich und oestlich von Berlin, je eine Fehlerart. UTC hat `check` schon. [INV-03, ADR-050]
  zeitzonen:
    name: zeitzonen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run test:tz -- America/Los_Angeles Pacific/Kiritimati

  audit:
    name: audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      # Eigener Job, nicht Teil von `check`: das hier braucht das Netz, `check` nicht.
      # Ein Fund haelt den Lauf an, aendert aber nichts an der Aussage der Tests.
      - run: npm run audit

      # Dazu der volle Bericht, mit Dev-Paketen und ab `moderate`: zur Kenntnis, nicht als
      # Sperre. Ein Fund hier steht als Anmerkung am Lauf und wird gemeldet. [ADR-055]
      - name: npm audit (voll, nicht blockierend)
        continue-on-error: true
        run: npm audit

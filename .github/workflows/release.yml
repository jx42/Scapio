# Ein Release ist ein Tag auf einem geprueften Stand von `main`, mit `Scapio.zip` als Anhang.
# [ADR-047]
#
# Von Hand ausgeloest und ohne Eingabe: Die Version steht in `package.json` auf `main` und wird
# per PR erhoeht. Der Workflow schreibt auf keinen Branch. So gibt es keinen Input, der in ein
# Skript gelangen koennte, keinen Push gegen den Branch-Schutz und keinen Commit, den
# `pruefung.yml` nie gesehen hat.
#
# Der Job `release` fuehrt kein npm-Paket aus, nur git und gh. Gebaut wird beim Nutzer.

name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.lesen.outputs.version }}
    steps:
      - name: Nur von main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release nur von main, nicht von $GITHUB_REF"
          exit 1

      # Volle Tiefe, damit die Tags lokal liegen und die Pruefung unten ohne Token auskommt.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Version lesen
        id: lesen
        run: |
          version=$(jq -r .version package.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Ungueltige Version in package.json: '$version' (erwartet X.Y.Z)"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version existiert schon. Erst package.json per PR erhoehen."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  pruefung:
    name: pruefung
    needs: version
    uses: ./.github/workflows/pruefung.yml

  release:
    name: release
    needs: [version, pruefung]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # `--prefix` gibt dem Ordner im ZIP den Namen `Scapio`. Was ins ZIP gehoert, regelt
      # `export-ignore` in `.gitattributes`.
      - name: ZIP bauen
        run: |
          git archive --format=zip --prefix=Scapio/ -o Scapio.zip HEAD
          sha256sum Scapio.zip > SHA256SUMS

      # GitHub stellt Attestations fuer private Repositories eines Nutzers nicht aus; bis zur
      # Veroeffentlichung entsteht das Release ohne. [ADR-047]
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: Scapio.zip

      # `--target` legt den Tag auf genau den Commit, den `pruefung` geprueft hat.
      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" Scapio.zip SHA256SUMS \
            --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
